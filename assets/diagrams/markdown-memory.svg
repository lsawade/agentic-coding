<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Three sessions passing context through markdown files</title>
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E87722"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="20" y="20" width="340" height="110" rx="14" fill="#000"/>
<text x="190" y="86" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">Session 1: brainstorm</text>
<rect x="400" y="20" width="340" height="110" rx="14" fill="#000"/>
<text x="570" y="86" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">Session 2: plan</text>
<rect x="780" y="20" width="340" height="110" rx="14" fill="#000"/>
<text x="950" y="86" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">Session 3: execute</text>
<path d="M40 250 H310 L340 280 V380 H40 Z" fill="#f6f3ee" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
<path d="M310 250 V280 H340" fill="none" stroke="#1f1f1f" stroke-width="3"/>
<text x="190" y="327" font-size="30" font-weight="700" fill="#000" text-anchor="middle">notes/idea.md</text>
<line x1="120" y1="134" x2="140" y2="244" stroke="#E87722" stroke-width="4" marker-end="url(#o)"/>
<text x="132" y="200" font-size="30" fill="#E87722">writes</text>
<path d="M420 250 H690 L720 280 V380 H420 Z" fill="#f6f3ee" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
<path d="M690 250 V280 H720" fill="none" stroke="#1f1f1f" stroke-width="3"/>
<text x="570" y="327" font-size="30" font-weight="700" fill="#000" text-anchor="middle">plans/analysis.md</text>
<line x1="500" y1="134" x2="520" y2="244" stroke="#E87722" stroke-width="4" marker-end="url(#o)"/>
<text x="512" y="200" font-size="30" fill="#E87722">writes</text>
<path d="M800 250 H1070 L1100 280 V380 H800 Z" fill="#f6f3ee" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/>
<path d="M1070 250 V280 H1100" fill="none" stroke="#1f1f1f" stroke-width="3"/>
<text x="950" y="327" font-size="30" font-weight="700" fill="#000" text-anchor="middle">results/log.md</text>
<line x1="880" y1="134" x2="900" y2="244" stroke="#E87722" stroke-width="4" marker-end="url(#o)"/>
<text x="892" y="200" font-size="30" fill="#E87722">writes</text>
<path d="M344 330 C410 330 650 260 650 138" fill="none" stroke="#6b6b6b" stroke-width="4" marker-end="url(#g)"/>
<path d="M724 330 C790 330 1030 260 1030 138" fill="none" stroke="#6b6b6b" stroke-width="4" marker-end="url(#g)"/>
<text x="400" y="460" font-size="30" fill="#6b6b6b">reads</text>
<text x="20" y="520" font-size="30" fill="#E87722" font-weight="700">orange = writes</text><text x="330" y="520" font-size="30" fill="#6b6b6b" font-weight="700">gray = reads</text>
<rect x="1160" y="60" width="420" height="330" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="3"/>
<text x="1190" y="116" font-size="34" font-weight="700" fill="#000">Treat a long task</text>
<text x="1190" y="158" font-size="34" font-weight="700" fill="#000">like a research article</text>
<text x="1190" y="226" font-size="32" fill="#1f1f1f">question</text>
<text x="1190" y="270" font-size="32" fill="#1f1f1f">method</text>
<text x="1190" y="314" font-size="32" fill="#1f1f1f">results</text>
<text x="1190" y="358" font-size="32" fill="#1f1f1f">open questions</text>
</svg>
