<g font-size="40" font-weight="700" fill="#1f1f1f"><text x="360" y="95">Planning, review, hard reasoning</text><text x="360" y="275">Daily work: writing and editing code</text><text x="360" y="455">Search, grep, test runs, summaries</text></g>
