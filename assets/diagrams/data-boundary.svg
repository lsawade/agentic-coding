<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Data boundary: what may cross from your machine to a hosted model</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E87722"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
  </defs>
  <!-- headers -->
  <text x="215" y="48" font-size="34" font-weight="700" fill="#000" text-anchor="middle">Your cluster / laptop</text>
  <text x="740" y="48" font-size="34" font-weight="700" fill="#000" text-anchor="middle">Hosted API</text>
  <!-- wall -->
  <rect x="440" y="80" width="16" height="670" fill="#000"/>
  <!-- local side -->
  <rect x="20" y="96" width="400" height="76" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="3"/>
  <text x="220" y="146" font-size="34" font-weight="700" fill="#1f1f1f" text-anchor="middle">Open-weight model</text>
  <text x="220" y="222" font-size="30" fill="#6b6b6b" text-anchor="middle">raw data, unpublished results</text>
  <!-- hosted side -->
  <rect x="600" y="96" width="280" height="654" rx="14" fill="#f6f3ee" stroke="#d9d4cc" stroke-width="3"/>
  <text x="740" y="410" font-size="36" font-weight="700" fill="#1f1f1f" text-anchor="middle">Frontier</text>
  <text x="740" y="452" font-size="36" font-weight="700" fill="#1f1f1f" text-anchor="middle">model</text>
  <!-- may cross -->
  <g font-size="30" fill="#1f1f1f">
    <text x="20" y="310">code</text>
    <text x="20" y="390">public data</text>
    <text x="20" y="470">anonymized</text>
    <text x="20" y="502">summaries</text>
  </g>
  <g stroke="#E87722" stroke-width="4" marker-end="url(#ok)">
    <line x1="345" y1="300" x2="590" y2="300"/>
    <line x1="345" y1="380" x2="590" y2="380"/>
    <line x1="345" y1="475" x2="590" y2="475"/>
  </g>
  <line x1="20" y1="550" x2="420" y2="550" stroke="#d9d4cc" stroke-width="3"/>
  <!-- must not cross -->
  <g font-size="30" fill="#1f1f1f">
    <text x="20" y="610">PII</text>
    <text x="20" y="680">IRB data</text>
    <text x="20" y="750">credentials</text>
  </g>
  <g stroke="#6b6b6b" stroke-width="4" marker-end="url(#no)">
    <line x1="220" y1="600" x2="430" y2="600"/>
    <line x1="220" y1="670" x2="430" y2="670"/>
    <line x1="220" y1="740" x2="430" y2="740"/>
  </g>
  <g stroke="#E87722" stroke-width="5" stroke-linecap="round">
    <path d="M300,585 L330,615 M330,585 L300,615"/>
    <path d="M300,655 L330,685 M330,655 L300,685"/>
    <path d="M300,725 L330,755 M330,725 L300,755"/>
  </g>
</svg>
