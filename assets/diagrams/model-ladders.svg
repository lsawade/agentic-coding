<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Model ladders: price per 1M tokens from top to bottom tier, Anthropic, OpenAI, Google (20 Oct 2026)</title>
  <!-- bar length = output price, linear: $50 = 330px (6.6 px per $) -->

  <!-- ===== Anthropic, x0 = 40 ===== -->
  <g>
    <text x="40" y="70" font-size="40" font-weight="700" fill="#000">Anthropic</text>
    <line x1="48" y1="120" x2="48" y2="790" stroke="#d9d4cc" stroke-width="4"/>
    <g font-size="34" font-weight="700" fill="#000">
      <text x="70" y="160">Fable 5.1</text>
      <text x="70" y="330">Opus 5.5</text>
      <text x="70" y="500">Sonnet 5.5</text>
      <text x="70" y="670">Haiku 5.5</text>
    </g>
    <g font-size="30" fill="#6b6b6b">
      <text x="70" y="198">$10 / $50</text>
      <text x="70" y="368">$4 / $20</text>
      <text x="70" y="538">$2 / $10</text>
      <text x="70" y="708">$0.10 / $0.50</text>
    </g>
    <g fill="#f6f3ee">
      <rect x="70" y="216" width="330" height="30" rx="6"/>
      <rect x="70" y="386" width="330" height="30" rx="6"/>
      <rect x="70" y="556" width="330" height="30" rx="6"/>
      <rect x="70" y="726" width="330" height="30" rx="6"/>
    </g>
    <g fill="#E87722">
      <rect x="70" y="216" width="330" height="30" rx="6"/>
      <rect x="70" y="386" width="132" height="30" rx="6"/>
      <rect x="70" y="556" width="66"  height="30" rx="6"/>
      <rect x="70" y="726" width="4"   height="30"/>
    </g>
    <path d="M415,130 H435 V756 H415 M435,443 H450" fill="none" stroke="#000" stroke-width="4"/>
    <text x="458" y="456" font-size="40" font-weight="800" fill="#E87722">100×</text>
  </g>

  <!-- ===== OpenAI, x0 = 565 ===== -->
  <g>
    <text x="565" y="70" font-size="40" font-weight="700" fill="#000">OpenAI</text>
    <line x1="573" y1="120" x2="573" y2="790" stroke="#d9d4cc" stroke-width="4"/>
    <g font-size="34" font-weight="700" fill="#000">
      <text x="595" y="160">GPT-6 Astra</text>
      <text x="595" y="415">GPT-6.1 Sol</text>
      <text x="595" y="670">GPT-6 Luna</text>
    </g>
    <g font-size="30" fill="#6b6b6b">
      <text x="595" y="198">$10 / $50</text>
      <text x="595" y="453">$2 / $10</text>
      <text x="595" y="708">$0.10 / $0.50</text>
    </g>
    <g fill="#f6f3ee">
      <rect x="595" y="216" width="330" height="30" rx="6"/>
      <rect x="595" y="471" width="330" height="30" rx="6"/>
      <rect x="595" y="726" width="330" height="30" rx="6"/>
    </g>
    <g fill="#E87722">
      <rect x="595" y="216" width="330" height="30" rx="6"/>
      <rect x="595" y="471" width="66"  height="30" rx="6"/>
      <rect x="595" y="726" width="4"   height="30"/>
    </g>
    <path d="M940,130 H960 V756 H940 M960,443 H975" fill="none" stroke="#000" stroke-width="4"/>
    <text x="983" y="456" font-size="40" font-weight="800" fill="#E87722">100×</text>
  </g>

  <!-- ===== Google, x0 = 1090 ===== -->
  <g>
    <text x="1090" y="70" font-size="40" font-weight="700" fill="#000">Google</text>
    <line x1="1098" y1="120" x2="1098" y2="790" stroke="#d9d4cc" stroke-width="4"/>
    <g font-size="34" font-weight="700" fill="#000">
      <text x="1120" y="160">Gemini 4 Argon</text>
      <text x="1120" y="415">3.8 Flash</text>
      <text x="1120" y="670">3.5 Flash-Lite</text>
    </g>
    <g font-size="30" fill="#6b6b6b">
      <text x="1120" y="198">$2 / $10</text>
      <text x="1120" y="453">$0.75 / $3.75</text>
      <text x="1120" y="708">$0.30 / $2.50</text>
    </g>
    <g fill="#f6f3ee">
      <rect x="1120" y="216" width="330" height="30" rx="6"/>
      <rect x="1120" y="471" width="330" height="30" rx="6"/>
      <rect x="1120" y="726" width="330" height="30" rx="6"/>
    </g>
    <g fill="#E87722">
      <rect x="1120" y="216" width="66" height="30" rx="6"/>
      <rect x="1120" y="471" width="25" height="30" rx="6"/>
      <rect x="1120" y="726" width="17" height="30" rx="6"/>
    </g>
    <path d="M1465,130 H1485 V756 H1465 M1485,443 H1500" fill="none" stroke="#000" stroke-width="4"/>
    <text x="1499" y="456" font-size="40" font-weight="800" fill="#E87722">4–7×</text>
  </g>

  <!-- legend -->
  <rect x="40" y="836" width="40" height="30" rx="6" fill="#E87722"/>
  <text x="96" y="862" font-size="30" fill="#1f1f1f">bar = output price, linear scale (full bar = $50)   ·   labels = $input / $output per 1M tokens</text>
</svg>
