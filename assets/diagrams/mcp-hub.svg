<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>MCP hub and spoke: one agent connected to six tools</title>
<line x1="800" y1="420" x2="250" y2="125" stroke="#1f1f1f" stroke-width="4"/>
<line x1="800" y1="420" x2="800" y2="105" stroke="#1f1f1f" stroke-width="4"/>
<line x1="800" y1="420" x2="1350" y2="125" stroke="#1f1f1f" stroke-width="4"/>
<line x1="800" y1="420" x2="250" y2="645" stroke="#1f1f1f" stroke-width="4"/>
<line x1="800" y1="420" x2="800" y2="685" stroke="#1f1f1f" stroke-width="4"/>
<line x1="800" y1="420" x2="1350" y2="645" stroke="#1f1f1f" stroke-width="4"/>
<rect x="20" y="40" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="250" y="115" font-size="38" font-weight="700" fill="#000" text-anchor="middle">IDE</text><text x="250" y="165" font-size="32" fill="#1f1f1f" text-anchor="middle">(diagnostics, refactors)</text>
<rect x="570" y="20" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="800" y="95" font-size="38" font-weight="700" fill="#000" text-anchor="middle">Jupyter</text><text x="800" y="145" font-size="32" fill="#1f1f1f" text-anchor="middle">(run cells, read outputs)</text>
<rect x="1120" y="40" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="1350" y="115" font-size="38" font-weight="700" fill="#000" text-anchor="middle">Database</text><text x="1350" y="165" font-size="32" fill="#1f1f1f" text-anchor="middle">(read-only)</text>
<rect x="20" y="560" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="250" y="635" font-size="38" font-weight="700" fill="#000" text-anchor="middle">Reference manager</text><text x="250" y="685" font-size="32" fill="#1f1f1f" text-anchor="middle">(Zotero)</text>
<rect x="570" y="600" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="800" y="675" font-size="38" font-weight="700" fill="#000" text-anchor="middle">Cluster scheduler</text><text x="800" y="725" font-size="32" fill="#1f1f1f" text-anchor="middle">(Slurm)</text>
<rect x="1120" y="560" width="460" height="170" rx="14" fill="#fff" stroke="#E87722" stroke-width="4"/>
<text x="1350" y="658" font-size="38" font-weight="700" fill="#000" text-anchor="middle">Docs and tickets</text>
<rect x="660" y="340" width="280" height="160" rx="14" fill="#000"/><text x="800" y="434" font-size="44" font-weight="700" fill="#fff" text-anchor="middle">Agent</text>
<text x="800" y="866" font-size="32" fill="#6b6b6b" text-anchor="middle">MCP = Model Context Protocol, one plug shape for all of them</text>
</svg>
