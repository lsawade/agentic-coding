<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>PI and student, researcher and agent: the same contract</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f1f1f"/></marker></defs>
<g stroke-width="3" fill="#f6f3ee" stroke="#d9d4cc"><rect x="40" y="20" width="660" height="860" rx="14"/><rect x="900" y="20" width="660" height="860" rx="14"/></g>
<g font-size="40" font-weight="800" text-anchor="middle">
<rect x="220" y="60" width="300" height="110" rx="14" fill="#000"/><text x="370" y="132" fill="#fff">PI</text>
<rect x="220" y="470" width="300" height="110" rx="14" fill="#fff" stroke="#1f1f1f" stroke-width="4"/><text x="370" y="542" fill="#000">Student</text>
<rect x="1080" y="60" width="300" height="110" rx="14" fill="#000"/><text x="1230" y="132" fill="#fff">Researcher</text>
<rect x="1080" y="470" width="300" height="110" rx="14" fill="#fff" stroke="#1f1f1f" stroke-width="4"/><text x="1230" y="542" fill="#000">Agent</text>
</g>
<g stroke="#1f1f1f" stroke-width="4" marker-end="url(#a)">
<line x1="300" y1="180" x2="300" y2="460"/><line x1="440" y1="460" x2="440" y2="180"/>
<line x1="1160" y1="180" x2="1160" y2="460"/><line x1="1300" y1="460" x2="1300" y2="180"/></g>
<g font-size="34" fill="#1f1f1f">
<text x="270" y="330" text-anchor="end">delegates</text><text x="1130" y="330" text-anchor="end">delegates</text>
<text x="470" y="310">drafts, runs,</text><text x="470" y="352">proposes</text>
<text x="1330" y="310">drafts, runs,</text><text x="1330" y="352">proposes</text></g>
<rect x="80" y="660" width="580" height="170" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="4"/>
<rect x="940" y="660" width="580" height="170" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="4"/>
<g font-size="36" font-weight="700" fill="#1f1f1f" text-anchor="middle">
<text x="370" y="725">signs off:</text><text x="370" y="780" font-weight="400">the PI's name is on the paper</text>
<text x="1230" y="725">signs off:</text><text x="1230" y="780" font-weight="400">your name is on the PR</text></g>
<text x="800" y="400" text-anchor="middle" font-size="120" font-weight="800" fill="#E87722">=</text>
<g font-size="32" font-weight="700" fill="#1f1f1f" text-anchor="middle"><text x="800" y="470">same</text><text x="800" y="510">contract</text></g>
</svg>
