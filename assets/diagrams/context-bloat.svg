<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Context bloat: one session's context window fills with re-reads, tool output and fix-it loops until it hits the limit</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E87722"/>
    </marker>
  </defs>

  <!-- label over the small useful segment -->
  <text x="170" y="150" font-size="32" font-weight="700" fill="#E87722" text-anchor="middle">the actual task</text>

  <!-- context window bar, filled left to right in time order -->
  <rect x="80" y="180" width="180" height="130" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="4"/>
  <rect x="264" y="180" width="356" height="130" fill="#6b6b6b"/>
  <text x="442" y="256" font-size="32" fill="#fff" text-anchor="middle">file re-reads</text>
  <rect x="624" y="180" width="356" height="130" fill="#d9d4cc"/>
  <text x="802" y="256" font-size="32" fill="#1f1f1f" text-anchor="middle">tool output</text>
  <g fill="#1f1f1f">
    <rect x="984"  y="180" width="111" height="130"/>
    <rect x="1099" y="180" width="111" height="130"/>
    <rect x="1214" y="180" width="111" height="130"/>
    <rect x="1329" y="180" width="111" height="130"/>
  </g>
  <text x="1212" y="150" font-size="32" font-weight="700" fill="#1f1f1f" text-anchor="middle">fix-it loop ×4</text>

  <!-- context limit -->
  <line x1="1450" y1="110" x2="1450" y2="370" stroke="#000" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="1450" y="100" font-size="32" font-weight="700" fill="#000" text-anchor="middle">context limit</text>

  <!-- restart marker where useful work stopped -->
  <line x1="262" y1="165" x2="262" y2="400" stroke="#E87722" stroke-width="6"/>
  <path d="M248,400 L276,400 L262,376 z" fill="#E87722"/>
  <text x="240" y="440" font-size="34" font-weight="700" fill="#E87722">restart with a plan here</text>
  <text x="680" y="440" font-size="30" fill="#6b6b6b">everything to the right: paid for, and in the way</text>

  <!-- timeline -->
  <line x1="80" y1="500" x2="1450" y2="500" stroke="#6b6b6b" stroke-width="3" marker-end="url(#ah)"/>
  <text x="80" y="545" font-size="30" fill="#6b6b6b">session time</text>
</svg>
