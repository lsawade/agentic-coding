<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Harness and model are separate layers: you swap one without the other</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E87722"/>
    </marker>
  </defs>

  <!-- Layer 1: you + workflow -->
  <rect x="40" y="30" width="1230" height="150" rx="14" fill="#FBE7D6" stroke="#E87722" stroke-width="4"/>
  <text x="655" y="95" font-size="40" font-weight="700" fill="#000" text-anchor="middle">You + your workflow</text>
  <text x="655" y="145" font-size="32" fill="#1f1f1f" text-anchor="middle">AGENTS.md · plans · review</text>

  <!-- Layer 2: harness -->
  <rect x="40" y="220" width="1230" height="210" rx="14" fill="#f6f3ee" stroke="#d9d4cc" stroke-width="3"/>
  <text x="70" y="268" font-size="36" font-weight="700" fill="#000">Harness <tspan font-weight="400" fill="#6b6b6b" font-size="30">(the tool you type into)</tspan></text>
  <g font-size="32" fill="#1f1f1f" text-anchor="middle">
    <rect x="70"   y="296" width="220" height="104" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="180"  y="360">Claude Code</text>
    <rect x="307"  y="296" width="220" height="104" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="417"  y="360">Codex CLI</text>
    <rect x="544"  y="296" width="220" height="104" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="654"  y="340">Antigravity</text>
    <text x="654"  y="380">CLI</text>
    <rect x="781"  y="296" width="220" height="104" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="891"  y="360">Cursor</text>
    <rect x="1018" y="296" width="220" height="104" rx="14" fill="#fff" stroke="#000" stroke-width="3"/>
    <text x="1128" y="360">Copilot</text>
  </g>

  <!-- swap arrow -->
  <line x1="300" y1="442" x2="300" y2="512" stroke="#E87722" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="325" y="488" font-size="34" font-weight="700" fill="#E87722">swap either one</text>

  <!-- Layer 3: model (vendor / family / tiers) -->
  <rect x="40" y="524" width="1230" height="360" rx="14" fill="#f6f3ee" stroke="#d9d4cc" stroke-width="3"/>
  <text x="70" y="572" font-size="36" font-weight="700" fill="#000">Model <tspan font-weight="400" fill="#6b6b6b" font-size="30">(the engine under it)</tspan></text>
  <g font-size="30" fill="#1f1f1f">
    <rect x="70" y="592" width="280" height="280" rx="14" fill="#fff" stroke="#6b6b6b" stroke-width="3"/>
    <text x="92" y="636" font-size="34" font-weight="700" fill="#000">Anthropic</text>
    <text x="92" y="672" fill="#6b6b6b">Claude</text>
    <line x1="92" y1="690" x2="328" y2="690" stroke="#d9d4cc" stroke-width="2"/>
    <text x="92" y="728">Fable</text>
    <text x="92" y="766">Opus</text>
    <text x="92" y="804">Sonnet</text>
    <text x="92" y="842">Haiku</text>

    <rect x="366" y="592" width="280" height="280" rx="14" fill="#fff" stroke="#6b6b6b" stroke-width="3"/>
    <text x="388" y="636" font-size="34" font-weight="700" fill="#000">OpenAI</text>
    <text x="388" y="672" fill="#6b6b6b">GPT-6</text>
    <line x1="388" y1="690" x2="624" y2="690" stroke="#d9d4cc" stroke-width="2"/>
    <text x="388" y="728">Astra</text>
    <text x="388" y="766">Sol</text>
    <text x="388" y="804">Luna</text>

    <rect x="662" y="592" width="280" height="280" rx="14" fill="#fff" stroke="#6b6b6b" stroke-width="3"/>
    <text x="684" y="636" font-size="34" font-weight="700" fill="#000">Google</text>
    <text x="684" y="672" fill="#6b6b6b">Gemini</text>
    <line x1="684" y1="690" x2="920" y2="690" stroke="#d9d4cc" stroke-width="2"/>
    <text x="684" y="728">Argon</text>
    <text x="684" y="766">Flash</text>

    <rect x="958" y="592" width="280" height="280" rx="14" fill="#fff" stroke="#6b6b6b" stroke-width="3"/>
    <text x="980" y="636" font-size="34" font-weight="700" fill="#000">Open-weight</text>
    <text x="980" y="672" fill="#6b6b6b">by lab</text>
    <line x1="980" y1="690" x2="1216" y2="690" stroke="#d9d4cc" stroke-width="2"/>
    <text x="980" y="728">DeepSeek · Qwen</text>
    <text x="980" y="766">Kimi · GLM</text>
    <text x="980" y="804">…</text>
  </g>

  <!-- bracket: where today's tips live -->
  <path d="M1300,30 H1330 V430 H1300 M1330,230 H1360" fill="none" stroke="#E87722" stroke-width="4"/>
  <g font-size="36" font-weight="700" fill="#E87722">
    <text x="1375" y="190">where</text>
    <text x="1375" y="235">today's</text>
    <text x="1375" y="280">tips live</text>
  </g>
</svg>
