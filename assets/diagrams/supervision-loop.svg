<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The supervision loop: plan, small steps, review, with the researcher deciding at the centre</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E87722"/>
    </marker>
  </defs>

  <!-- loop arcs (centre 800,470, r 270), clockwise -->
  <g fill="none" stroke="#E87722" stroke-width="4" marker-end="url(#arr)">
    <path d="M972,262 A270,270 0 0 1 1059,545"/>
    <path d="M928,708 A270,270 0 0 1 672,708"/>
    <path d="M541,545 A270,270 0 0 1 628,262"/>
  </g>

  <!-- centre -->
  <text x="800" y="490" font-size="56" font-weight="800" fill="#000" text-anchor="middle">You decide</text>

  <!-- Before: plan -->
  <rect x="470" y="20" width="660" height="230" rx="14" fill="#f6f3ee" stroke="#E87722" stroke-width="4"/>
  <text x="800" y="74" font-size="40" font-weight="700" fill="#000" text-anchor="middle">Before: plan</text>
  <g font-size="31" fill="#1f1f1f" text-anchor="middle">
    <text x="800" y="124">brainstorm, feasibility run, then plan</text>
    <text x="800" y="169">/grill-me the foggy parts</text>
    <text x="800" y="214">a clearly defined /goal</text>
  </g>

  <!-- During: small steps -->
  <rect x="940" y="560" width="620" height="230" rx="14" fill="#f6f3ee" stroke="#E87722" stroke-width="4"/>
  <text x="1250" y="614" font-size="40" font-weight="700" fill="#000" text-anchor="middle">During: small steps</text>
  <g font-size="31" fill="#1f1f1f" text-anchor="middle">
    <text x="1250" y="664">minimal work at a time</text>
    <text x="1250" y="709">chunks you can review</text>
    <text x="1250" y="754">restart when it gets confused</text>
  </g>

  <!-- After: review -->
  <rect x="40" y="560" width="620" height="230" rx="14" fill="#f6f3ee" stroke="#E87722" stroke-width="4"/>
  <text x="350" y="614" font-size="40" font-weight="700" fill="#000" text-anchor="middle">After: review</text>
  <g font-size="31" fill="#1f1f1f" text-anchor="middle">
    <text x="350" y="664">always review; it assumes things</text>
    <text x="350" y="709">second model as adversary</text>
    <text x="350" y="754">clean rewrite after prototyping</text>
  </g>
</svg>
